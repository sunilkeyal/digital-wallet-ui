name: Build and Deploy UI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout iac repo for Terraform state
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/digital-wallet-iac
          path: digital-wallet-iac
          token: ${{ secrets.GH_PAT }}

      - name: Set OCIR image name
        id: set-image
        run: |
          OCIR_REGION="${{ vars.OCI_REGION || 'us-ashburn-1' }}"
          OCIR_NS="${{ vars.OCI_OBJECT_STORAGE_NAMESPACE }}"
          IMG="$OCIR_REGION.ocir.io/$OCIR_NS/digital-wallet-frontend"
          echo "image=$IMG" >> $GITHUB_OUTPUT
          echo "FRONTEND_IMAGE=$IMG" >> $GITHUB_ENV

      - name: Log in to OCI Container Registry
        run: |
          OCIR_HOST="${{ vars.OCI_REGION || 'us-ashburn-1' }}.ocir.io"
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            "$OCIR_HOST" \
            --username "${{ secrets.OCI_DOCKER_USERNAME }}" \
            --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get VM and LB IPs from Terraform
        id: tf
        working-directory: digital-wallet-iac
        run: |
          terraform init
          echo "vm_public_ip=$(terraform output -raw vm_public_ip)" >> $GITHUB_OUTPUT
          echo "lb_ip=$(terraform output -raw load_balancer_public_ip)" >> $GITHUB_OUTPUT
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TFE_TOKEN }}

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ steps.tf.outputs.vm_public_ip }} >> ~/.ssh/known_hosts

      - name: Update frontend image on VM
        run: |
          IMAGE="${{ steps.set-image.outputs.image }}:${{ env.IMAGE_TAG }}"
          ssh opc@${{ steps.tf.outputs.vm_public_ip }} "
            grep -q '^FRONTEND_IMAGE=' /opt/digital-wallet/.env && \
              sudo sed -i 's|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=$IMAGE|' /opt/digital-wallet/.env || \
              echo 'FRONTEND_IMAGE=$IMAGE' | sudo tee -a /opt/digital-wallet/.env
          "

      - name: Deploy on VM
        run: |
          ssh opc@${{ steps.tf.outputs.vm_public_ip }} \
            "OCI_DOCKER_USERNAME='${{ secrets.OCI_DOCKER_USERNAME }}' \
             OCI_AUTH_TOKEN='${{ secrets.OCI_AUTH_TOKEN }}' \
             sudo -E /opt/digital-wallet/deploy.sh"

      - name: Verify frontend
        run: |
          sleep 10
          curl -s -o /dev/null -w "Frontend: %{http_code}\n" "http://${{ steps.tf.outputs.lb_ip }}/"
