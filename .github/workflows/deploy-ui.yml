name: Build and Deploy UI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/**'
      - 'index.html'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/**'
      - 'index.html'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'digital-wallet-rg' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Discover backend URL
        id: backend
        run: |
          APP_NAME=$(az webapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" \
            -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: No App Service found in ${{ env.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi
          HOST=$(az webapp show --name "$APP_NAME" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" --query defaultHostName -o tsv)
          echo "url=https://${HOST}/api" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}

      - name: Discover Static Web App
        id: discover
        run: |
          APP_NAME=$(az staticwebapp list \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "[0].name" \
            -o tsv)
          if [ -z "$APP_NAME" ]; then
            echo "ERROR: No Static Web App found in ${{ env.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Fetch deployment token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ steps.discover.outputs.app_name }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" \
            -o tsv)
          echo "::add-mask::$TOKEN"
          echo "deployment_token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.deployment_token }}
          skip_app_build: true
          skip_api_build: true
          app_location: dist
          action: upload
